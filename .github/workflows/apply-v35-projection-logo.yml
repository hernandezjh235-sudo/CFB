name: Apply CFB v3.5 Projection Logo Repair
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-v35-projection-logo.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Apply v3.5
        run: python scripts/apply_v35_projection_logo_repair.py
      - name: Syntax check
        run: python -m py_compile app.py propline_cfb_v31.py cfb_nfl_ui_v18.py
      - name: Install smoke dependencies
        run: pip install -q numpy requests
      - name: Identity parser smoke
        run: |
          python - <<'PY'
          from propline_cfb_v31 import _clean_player_and_hint,_resolve_team_hint
          assert _clean_player_and_hint('Steve Angeli (SYR)') == ('Steve Angeli','SYR')
          assert _resolve_team_hint('SYR','Syracuse','Pittsburgh') == 'Syracuse'
          assert _resolve_team_hint('PITT','Syracuse','Pittsburgh') == 'Pittsburgh'
          print('v3.5 identity smoke OK')
          PY
      - name: Commit v3.5
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py cfb_nfl_ui_v18.py
          git commit -m 'Apply CFB v3.5 projection join and logo repair [skip ci]' || exit 0
          git pull --rebase origin main
          git push
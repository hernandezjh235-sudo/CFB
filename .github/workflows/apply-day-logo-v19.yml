name: Apply CFB Day + Logo v1.9

on:
  push:
    branches: [main]
    paths:
      - 'cfb_runtime_v19.py'
      - 'scripts/upgrade_day_logo_v19.py'
      - '.github/workflows/apply-day-logo-v19.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply day/logo patch
        run: python scripts/upgrade_day_logo_v19.py
      - name: Syntax check
        run: python -m py_compile app.py cfb_runtime_v19.py cfb_nfl_ui_v18.py free_data_v16.py underdog_cfb_v15.py
      - name: Runtime source smoke
        run: |
          pip install -r requirements.txt
          python - <<'PY'
          from free_data_v16 import load_free_stack
          from underdog_cfb_v15 import fetch_underdog_cfb_props
          from cfb_runtime_v19 import annotate_games, ensure_branding, filter_games_by_scope, filter_props_by_scope, local_now, logo_coverage
          now=local_now()
          bundle,ctx,players,market=load_free_stack(now.year,2)
          games=annotate_games(bundle.get('games',[]))
          ctx=ensure_branding(ctx,games,players)
          props,_=fetch_underdog_cfb_props(force=True)
          today=filter_games_by_scope(games,'Today',now)
          tomorrow=filter_games_by_scope(games,'Tomorrow',now)
          todays_props=filter_props_by_scope(props,'Today',now)
          h=logo_coverage(ctx,games)
          print({'now_pt':str(now),'games':len(games),'today_games':len(today),'tomorrow_games':len(tomorrow),'players':len(players),'props':len(props),'today_props':len(todays_props),'logo_health':h})
          assert len(games)>0, 'no games'
          assert len(players)>0, 'no players'
          assert len(props)>0, 'no live props'
          assert h['coverage']>=0.80, f"logo coverage too low: {h}"
          PY
      - name: Commit upgraded app
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          git commit -m 'Apply CFB v1.9 day-aware logo-locked board [skip ci]' || exit 0
          git push

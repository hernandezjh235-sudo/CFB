name: Apply CFB v3.3 Direct PropLine
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-v33-propline-direct.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Apply v3.3
        run: python scripts/apply_v33_propline_direct.py
      - name: Syntax check
        run: python -m py_compile app.py propline_cfb_v31.py
      - name: Static direct-key smoke
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('propline_cfb_v31.py').read_text()
          a=Path('app.py').read_text()
          assert 'return "football_ncaaf"' in s
          assert 'Underdog circuit breaker active' in a
          assert 'v3.3' in a
          print('v3.3 static smoke OK')
          PY
      - name: Commit v3.3
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py propline_cfb_v31.py
          git commit -m 'Apply CFB v3.3 direct PropLine NCAAF repair [skip ci]' || exit 0
          git pull --rebase origin main
          git push

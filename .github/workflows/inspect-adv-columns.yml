name: Inspect CFB Advanced Data
on:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-adv-columns.yml']
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pandas pyarrow requests numpy
      - name: Print available free schemas
        run: |
          python - <<'PY'
          import free_data_v15 as b
          for ds in ['game_rosters','adv_passing','adv_rushing','adv_receiving','adv_situational','injuries']:
              try:
                  d=b._parquet(ds,2026,ds)
                  print('\nDATASET',ds,'ROWS',len(d))
                  print('COLUMNS',list(d.columns))
                  print('SAMPLE',d.head(2).to_dict('records'))
              except Exception as e: print('\nDATASET',ds,'ERROR',e)
          PY

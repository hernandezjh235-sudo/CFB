name: Apply CFB NFL UI v1.8

on:
  push:
    branches: [main]
    paths:
      - 'scripts/upgrade_nfl_ui_v18.py'
      - 'cfb_nfl_ui_v18.py'
      - '.github/workflows/apply-nfl-ui-v18.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply NFL-style UI patch
        run: python scripts/upgrade_nfl_ui_v18.py
      - name: Syntax check
        run: python -m py_compile app.py cfb_nfl_ui_v18.py free_data_v16.py underdog_cfb_v15.py
      - name: Commit upgraded app
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          git commit -m 'Apply CFB v1.8 NFL-style moneyline logos and fast rows [skip ci]' || exit 0
          git push

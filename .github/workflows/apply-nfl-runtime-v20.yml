name: Apply CFB NFL Runtime v2.0

on:
  push:
    branches: [main]
    paths:
      - 'scripts/upgrade_nfl_runtime_v20.py'
      - 'scripts/finish_v20_helpers.py'
      - 'cfb_runtime_v20.py'
      - 'free_data_v16.py'
      - '.github/workflows/apply-nfl-runtime-v20.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply v2.0 patch
        run: |
          python scripts/upgrade_nfl_runtime_v20.py
          python scripts/finish_v20_helpers.py
      - name: Syntax check
        run: python -m py_compile app.py cfb_runtime_v20.py free_data_v16.py underdog_cfb_v15.py cfb_nfl_ui_v18.py
      - name: Install requirements
        run: pip install -r requirements.txt
      - name: Live tomorrow + projection smoke
        run: |
          python - <<'PY'
          from free_data_v16 import load_free_stack
          from underdog_cfb_v15 import fetch_underdog_cfb_props
          from cfb_runtime_v20 import local_now, day_games, filter_props_by_scope, ensure_branding, logo_coverage, games_from_props
          now=local_now(); bundle,ctx,players,market=load_free_stack(now.year,2)
          props,_=fetch_underdog_cfb_props(force=True)
          pday=filter_props_by_scope(props,'Tomorrow',now)
          tomorrow=day_games('Tomorrow',bundle.get('games',[]),now)
          if not tomorrow:
              tomorrow=games_from_props(pday,ctx)
          ctx=ensure_branding(ctx,tomorrow,players,pday)
          h=logo_coverage(ctx,tomorrow)
          print({'now':str(now),'tomorrow_games':len(tomorrow),'tomorrow_props':len(pday),'players':len(players),'logos':h,'free_health':bundle.get('free_health')})
          assert len(props)>0, 'no live CFB props'
          assert len(pday)>0, 'no next-day props'
          assert len(tomorrow)>0, 'no tomorrow games from schedule or live prop events'
          assert h['coverage']>=.90, f'logo coverage too low {h}'
          names=['Trinidad Chambliss','Demond Williams','CJ Carr','Lincoln Kienholz','Caden Pinnick','Colton Joseph']
          for n in names:
              hit=players[players.player.astype(str).str.lower()==n.lower()] if not players.empty else players
              print('PLAYER_CHECK',n,'rows',len(hit), (hit.iloc[0].to_dict() if len(hit) else {}))
          PY
      - name: Commit upgraded runtime
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py free_data_v16.py cfb_runtime_v20.py
          git commit -m 'Apply CFB v2.0 NFL-style auto slate and player baselines [skip ci]' || exit 0
          git push

name: Apply CFB Working Board v1.6

on:
  push:
    branches: [main]
    paths:
      - 'free_data_v16.py'
      - 'scripts/upgrade_working_v16.py'
      - '.github/workflows/apply-working-v16.yml'

permissions:
  contents: write

jobs:
  apply-v16:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply v1.6 repair
        run: python scripts/upgrade_working_v16.py
      - name: Syntax check
        run: python -m py_compile app.py free_data_v15.py free_data_v16.py underdog_cfb_v15.py
      - name: Commit repaired app
        run: |
          if git diff --quiet -- app.py; then
            echo 'No app changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          git commit -m 'Apply CFB v1.6 current-slate repair [skip ci]'
          git push

name: Apply CFB v3.8 Event Lock
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/apply_v38.py
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/apply_v38.py
      - run: |
          grep -q "CFB Prop Engine v3.8" app.py
          grep -q "reconcile_prop_games" cfb_runtime_v20.py
          grep -q "projection_source" app.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py cfb_runtime_v20.py cfb_nfl_ui_v18.py
          git diff --cached --quiet || git commit -m "Apply CFB v3.8 event lock and projection verify [skip ci]"
          git push

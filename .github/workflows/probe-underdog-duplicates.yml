name: Probe Underdog Duplicate CFB Lines
on:
  push:
    branches: [main]
    paths: ['.github/workflows/probe-underdog-duplicates.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Probe duplicate lines
        run: |
          python - <<'PY'
          from underdog_cfb_v15 import fetch_underdog_cfb_props
          rows,dbg=fetch_underdog_cfb_props(force=True)
          for r in rows:
              if str(r.get('player','')).lower() in {'kevin jennings','ashton daniels'}:
                  print('PARSED',r)
          PY

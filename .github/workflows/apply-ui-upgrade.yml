name: Apply CFB UI Upgrade

on:
  push:
    branches: [main]
    paths:
      - 'scripts/upgrade_ui_v12.py'
      - '.github/workflows/apply-ui-upgrade.yml'

permissions:
  contents: write

jobs:
  apply-upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply upgrade
        run: python scripts/upgrade_ui_v12.py
      - name: Syntax check
        run: python -m py_compile app.py
      - name: Commit upgraded app
        run: |
          if git diff --quiet -- app.py; then
            echo 'No app changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          git commit -m 'Apply CFB v1.2 elite player UI [skip ci]'
          git push

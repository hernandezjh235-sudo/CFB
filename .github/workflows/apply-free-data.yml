name: Apply CFB Free Data Upgrade

on:
  push:
    branches: [main]
    paths:
      - 'free_data.py'
      - 'scripts/upgrade_free_v13.py'
      - '.github/workflows/apply-free-data.yml'

permissions:
  contents: write

jobs:
  apply-free-upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply free data upgrade
        run: python scripts/upgrade_free_v13.py
      - name: Syntax check
        run: python -m py_compile app.py free_data.py
      - name: Commit upgraded app
        run: |
          if git diff --quiet -- app.py; then
            echo 'No app changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          git commit -m 'Apply CFB v1.3 free-data mode [skip ci]'
          git push

name: Apply CFB v4.0 Live Event
on:
  push:
    paths: [scripts/apply_v40_live_event.py]
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python scripts/apply_v40_live_event.py
      - run: |
          grep -q "CFB Prop Engine v4.0" app.py
          grep -q "reconcile_prop_games(scoped_boot,ctx)" app.py
          grep -q "projection withheld" app.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git diff --cached --quiet || git commit -m "Apply CFB v4.0 authoritative live-event repair [skip ci]"
          git push
